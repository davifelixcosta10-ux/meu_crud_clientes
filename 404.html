<!DOCTYPE html>
<!-- DaviFlow — 404 (404.html) — página de erro com links para home e dashboard -->
<html lang="pt-BR" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Página não encontrada | DaviFlow</title>
    <meta name="description" content="A página solicitada não foi encontrada no DaviFlow.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Geist', 'sans-serif'] },
                }
            }
        }
    </script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-zinc-50 dark:bg-[#09090b] text-zinc-800 dark:text-zinc-100 antialiased font-sans flex flex-col justify-between min-h-screen">

    <!-- Header / Brand -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2.5 group">
            <div class="w-9 h-9 rounded-xl bg-black dark:bg-white flex items-center justify-center">
                <i data-lucide="zap" class="w-5 h-5 text-white dark:text-black"></i>
            </div>
            <span class="text-xl font-bold text-black dark:text-white tracking-tight">Davi<span class="text-zinc-500 dark:text-zinc-400">Flow</span></span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-12 text-center max-w-md mx-auto">
        <div class="relative mb-6">
            <!-- Subtle background ring -->
            <div class="w-24 h-24 rounded-xl bg-zinc-100 dark:bg-[#18181b] border border-zinc-200 dark:border-zinc-700 flex items-center justify-center shadow-[0_4px_16px_rgba(0,0,0,0.06)] dark:shadow-[0_4px_16px_rgba(0,0,0,0.35)]">
                <span class="text-4xl font-black font-mono text-black dark:text-white tracking-tighter">404</span>
            </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black text-black dark:text-white tracking-tight mb-3">
            Página Não Encontrada
        </h1>

        <p class="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed mb-8">
            A página que você está tentando acessar não existe, foi removida ou o endereço (URL) foi digitado incorretamente.
        </p>

        <div class="flex flex-col sm:flex-row items-center gap-3 w-full">
            <a href="/" class="w-full sm:w-auto flex-1 btn-primary py-3 flex items-center justify-center gap-2 font-semibold">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Voltar ao Início</span>
            </a>
            <a href="/dashboard.html" class="w-full sm:w-auto flex-1 btn-ghost py-3 flex items-center justify-center gap-2 font-semibold">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-zinc-900 dark:text-zinc-100"></i>
                <span>Ir ao Painel</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs text-zinc-500 dark:text-zinc-400">
        <p>&copy; 2026 DaviFlow &middot; Todos os direitos reservados.</p>
        <div class="flex items-center justify-center gap-4 mt-2 text-xs">
            <a href="/privacidade.html" class="text-zinc-600 dark:text-zinc-400 hover:text-black dark:hover:text-white transition-colors">Política de Privacidade</a>
            <span class="text-zinc-400 dark:text-zinc-600">·</span>
            <a href="/termos.html" class="text-zinc-600 dark:text-zinc-400 hover:text-black dark:hover:text-white transition-colors">Termos de Serviço</a>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
